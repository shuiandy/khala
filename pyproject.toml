[project]
name = "khala"
version = "0.3.0"
description = "Shared long-term memory for AI agents: Markdown + Git, per-scope access, web admin, remote MCP"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{name = "Andy Hu"}]
keywords = ["mcp", "memory", "ai-agents", "oauth", "git", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = ["mcp==2.3.0", "uvicorn==0.54.0", "jinja2==3.1.6", "webauthn==3.0.1", "segno==1.6.6", "tzdata==2026.5", "pyyaml==6.0.2"]

[project.urls]
Homepage = "https://github.com/shuiandy/khala"
Repository = "https://github.com/shuiandy/khala"
Issues = "https://github.com/shuiandy/khala/issues"
Changelog = "https://github.com/shuiandy/khala/releases"

[project.scripts]
khala = "khala.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["khala"]

[tool.setuptools.package-data]
khala = ["templates/*.html", "static/*.css", "static/*.js", "static/*.png", "clients.yaml"]
