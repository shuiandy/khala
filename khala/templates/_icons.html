{# Line icons: inline SVG is exempt from the CSP's script and style limits; color follows currentColor #}
{% macro icon(name, size=18) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'overview' %}<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
{%- elif name == 'scopes' %}<path d="M3 7l9-4 9 4-9 4z"/><path d="M3 12l9 4 9-4"/><path d="M3 17l9 4 9-4"/>
{%- elif name == 'records' %}<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/>
{%- elif name == 'review' %}<path d="M3 13h5l2 3h4l2-3h5"/><path d="M5.5 5h13L21 13v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5z"/>
{%- elif name == 'agents' %}<rect x="5" y="7" width="14" height="12" rx="3"/><path d="M12 3v4M9.5 12v1M14.5 12v1M9.5 16h5"/>
{%- elif name == 'device' %}<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M2 20h20"/>
{%- elif name == 'audit' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- elif name == 'admin' %}<rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/>
{%- elif name == 'shield' %}<path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6z"/>
{%- elif name == 'shield-alert' %}<path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6z"/><path d="M12 9v4M12 16h.01"/>
{%- elif name == 'alert' %}<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>
{%- elif name == 'signout' %}<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l5-5-5-5M15 12H4"/>
{%- elif name == 'plus' %}<path d="M12 5v14M5 12h14"/>
{%- elif name == 'edit' %}<path d="M4 20h4L19 9l-4-4L4 16z"/>
{%- elif name == 'check' %}<path d="M5 12l4.5 4.5L19 7"/>
{%- endif %}</svg>
{%- endmacro %}
{% macro mark() -%}
<img src="/app/static/khala-icon.png?v={{ icon_version }}" width="40" height="40" alt="" aria-hidden="true">
{%- endmacro %}
