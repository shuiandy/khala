# How to connect each known MCP client to a Khala server, most convenient way first.
#
# Read by the web wizard (/app/connect), by `khala connect`, and by the consent page to recognise who is asking.
# Adding a client means adding an entry here; tests check every entry renders and every link decodes back.
#
# Placeholders in templates and configs: {url} the MCP endpoint, {name} the server name in the client's config,
# {token} a bearer token (only in channels with needs_token). A connector's `config` object is shown as JSON, so
# paths in it are escaped properly. In link templates also: {url_q} and {name_q}
# (percent-encoded), and the channel's `config` object as {config_json_q} (URL-encoded JSON), {config_b64}
# (base64), {config_b64_q} (base64, then URL-encoded) or {config_b64url} (base64url, no padding).
#
# identify: cimd lists client ID metadata document URLs (strong: the server fetches and checks them), cimd_pattern
# a regex for per-server variants, client_names the names clients send when they register (weak: self-reported,
# used only to suggest a name and kind, never for access).
#
# Channels with local: true start Khala on this computer over stdio instead ({khala} the program and {env} the
# settings file, both absolute paths); `khala connect --local` uses them and the web wizard never shows them.
#
# confidence: verified means an official source states it; unverified means it follows the documented schema
# but no official page shows this exact use, and the wizard says so.

- id: claude
  name: Claude (web, desktop and mobile)
  kind: device
  oauth: true
  identify:
    cimd: [https://claude.ai/oauth/mcp-oauth-client-metadata]
    client_names: [Claude]
  verified: 2026-10-08
  sources:
    - https://claude.com/docs/connectors/building/directory-vs-custom
    - https://claude.com/docs/connectors/custom/remote-mcp
    - https://claude.com/docs/connectors/building/authentication
    - https://modelcontextprotocol.io/docs/develop/connect-local-servers
  channels:
    - type: link
      label: Add to Claude
      template: "https://claude.ai/customize/connectors?modal=add-custom-connector&connectorName={name_q}&connectorUrl={url_q}"
      note: Opens a filled-in dialog in Claude; confirm it and sign in. Connectors added on the web also reach Claude Desktop and mobile.
      confidence: verified
    - type: connector
      label: Add by hand
      steps:
        - "Customize → Connectors → + Add → Add custom connector."
        - "Name it, paste {url} as the URL, and keep the default sign-in."
        - "On Team and Enterprise plans an owner adds it under Organization settings → Connectors, and members click Connect."
      note: The Free plan allows one custom connector.
      confidence: verified
    - type: file
      label: Claude Desktop on this computer
      local: true
      format: json
      path: {macos: "~/Library/Application Support/Claude/claude_desktop_config.json", windows: "%APPDATA%/Claude/claude_desktop_config.json"}
      merge: [mcpServers, "{name}"]
      entry: {command: "{khala}", args: ["--env", "{env}", "serve", "--stdio"]}
      note: Only Claude Desktop starts local servers; quit and reopen it afterwards. The web and mobile apps need a server.
      confidence: verified

- id: claude-code
  name: Claude Code
  kind: device
  oauth: true
  identify:
    cimd: [https://claude.ai/oauth/claude-code-client-metadata]
    client_names: [Claude Code]
  verified: 2026-10-08
  sources:
    - https://code.claude.com/docs/en/mcp
    - https://claude.ai/oauth/claude-code-client-metadata
  channels:
    - type: command
      label: One command
      binary: claude
      template: "claude mcp add --transport http --scope user {name} {url}"
      note: "Then run /mcp in a session to sign in. --scope user makes it available in every project. To have Claude Code leave memory notes on its own, add the Khala plugin: claude plugin install khala --marketplace shuiandy/khala."
      confidence: verified
    - type: file
      label: Project file
      format: json
      path: {all: ".mcp.json"}
      merge: [mcpServers, "{name}"]
      entry: {type: http, url: "{url}"}
      note: Shares the server with everyone working in this project; each person signs in for themselves.
      confidence: verified
    - type: command
      label: With a token instead of signing in
      binary: claude
      needs_token: true
      template: "claude mcp add --transport http --scope user {name} {url} --header \"Authorization: Bearer {token}\""
      note: "With a token set, Claude Code does not fall back to signing in if the token stops working. To have Claude Code leave memory notes on its own, add the Khala plugin: claude plugin install khala --marketplace shuiandy/khala."
      confidence: verified
    - type: command
      label: On this computer
      local: true
      binary: claude
      template: "claude mcp add --transport stdio --scope user {name} -- {khala} --env {env} serve --stdio"
      note: "Claude Code starts Khala itself; there is nothing to sign in to. To have Claude Code leave memory notes on its own, add the Khala plugin: claude plugin install khala --marketplace shuiandy/khala."
      confidence: verified

- id: chatgpt
  name: ChatGPT
  kind: device
  oauth: true
  identify:
    cimd: [https://chatgpt.com/oauth/client.json]
    cimd_pattern: "^https://chatgpt\\.com/oauth/[A-Za-z0-9_-]+/client\\.json$"
  verified: 2026-10-08
  sources:
    - https://developers.openai.com/api/docs/guides/custom-mcp-server
    - https://developers.openai.com/apps-sdk/build/auth
  channels:
    - type: connector
      label: Add as a plugin
      steps:
        - "Open chatgpt.com/plugins on the web, click +, and choose Add custom MCP server."
        - "Name it, paste {url} as the server URL, and choose OAuth for authentication."
        - "Create it as a plugin, install it from your personal plugins, then pick it with @ in a chat."
      note: Available where your workspace allows custom MCP servers. ChatGPT only signs in with OAuth; tokens are not supported.
      confidence: verified

- id: codex
  name: Codex
  kind: device
  oauth: true
  identify:
    cimd: [https://chatgpt.com/oauth/codex/client.json]
    cimd_pattern: "^https://chatgpt\\.com/oauth/codex/[A-Za-z0-9_-]+/client\\.json$"
    client_names: [Codex]
  verified: 2026-10-08
  sources:
    - https://learn.chatgpt.com/docs/extend/mcp?surface=cli
    - https://learn.chatgpt.com/docs/config-file/config-reference
  channels:
    - type: command
      label: One command
      binary: codex
      template: "codex mcp add {name} --url {url}"
      note: "Then sign in: codex mcp login {name}. The Codex app, CLI and IDE extension share this setting."
      confidence: verified
    - type: file
      label: Config file
      format: toml
      path: {all: "~/.codex/config.toml"}
      snippet: |
        [mcp_servers.{name}]
        url = "{url}"
      confidence: verified
    - type: command
      label: With a token instead of signing in
      binary: codex
      needs_token: true
      template: "codex mcp add {name} --url {url} --bearer-token-env-var KHALA_TOKEN"
      note: "Codex reads the token from KHALA_TOKEN when it starts; add export KHALA_TOKEN={token} to your shell profile."
      confidence: verified
    - type: command
      label: On this computer
      local: true
      binary: codex
      template: "codex mcp add {name} -- {khala} --env {env} serve --stdio"
      note: The Codex app, CLI and IDE extension share this setting.
      confidence: verified
    - type: file
      label: On this computer
      local: true
      format: toml
      path: {all: "~/.codex/config.toml"}
      snippet: |
        [mcp_servers.{name}]
        command = '{khala}'
        args = ['--env', '{env}', 'serve', '--stdio']
      confidence: verified

