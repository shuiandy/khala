name: Release

# A tag like v0.3.0 builds the package, runs the tests against it and publishes it to PyPI. Publishing uses PyPI's
# trusted publishing (OpenID Connect from this workflow), so no PyPI token is stored anywhere.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but pyproject says $version"; exit 1; }
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - name: Test the built wheel
        run: |
          python -m pip install dist/*.whl
          git config --global user.name "Khala CI"
          git config --global user.email "ci@example.invalid"
          cp -r tests "$RUNNER_TEMP/tests"       # outside the checkout, so the installed wheel is what gets imported
          cd "$RUNNER_TEMP/tests" && python -m unittest discover -s .
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
